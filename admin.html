<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renasant Support Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="h-[100dvh] bg-slate-100 text-slate-800 font-sans">

<div id="login" class="h-full flex items-center justify-center p-4">
  <form onsubmit="login(event)" class="w-full max-w-sm bg-white rounded-2xl shadow p-6 space-y-4">
    <h1 class="text-lg font-bold text-[#062d54]">Support admin</h1>
    <input id="email" type="email" required placeholder="Admin email" class="w-full p-3 border rounded-xl text-sm">
    <input id="password" type="password" required placeholder="Password" class="w-full p-3 border rounded-xl text-sm">
    <p id="login-err" class="text-xs text-red-600 hidden"></p>
    <button class="w-full bg-[#062d54] text-white py-3 rounded-xl font-bold text-sm">Log in</button>
  </form>
</div>

<div id="app" class="hidden h-full flex flex-col">
  <header class="bg-[#062d54] text-white px-4 py-3 flex justify-between items-center shrink-0">
    <span class="font-bold">Renasant Support Inbox</span>
    <button onclick="logout()" class="text-xs underline">Log out</button>
  </header>
  <div class="flex-1 min-h-0 flex">
    <aside id="list" class="w-full md:w-80 md:block bg-white border-r overflow-y-auto shrink-0"></aside>
    <section id="thread" class="hidden md:flex flex-1 flex-col min-w-0">
      <div class="px-4 py-3 bg-white border-b flex items-center space-x-3 shrink-0">
        <button onclick="closeThread()" class="md:hidden text-lg">&larr;</button>
        <div><div id="t-name" class="font-bold text-sm">Select a conversation</div><div id="t-sub" class="text-xs text-slate-500"></div></div>
      </div>
      <div id="msgs" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
      <form id="reply" onsubmit="send(event)" class="hidden p-3 bg-white border-t space-x-2 shrink-0">
        <input id="reply-input" autocomplete="off" placeholder="Type a reply..." class="flex-1 p-3 border rounded-xl text-sm min-w-0">
        <button class="bg-[#062d54] text-white px-5 rounded-xl text-sm font-bold">Send</button>
      </form>
    </section>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://tuuxyvxufxbyeeyrgebj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_73R5E7vPBpMAU1gPo65zpQ_ejMCBDQv';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let activeId = null, listSig = '', msgSig = '', timer = null;

function fmt(d) {
  const x = new Date(d), today = new Date().toDateString() === x.toDateString();
  return today ? x.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : x.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

async function login(e) {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) return showErr('Incorrect email or password');
  enter();
}
function showErr(m) { const el = $('login-err'); el.textContent = m; el.classList.remove('hidden'); }

async function enter() {
  const { data: ok } = await sb.rpc('is_admin');
  if (!ok) { await sb.auth.signOut(); showErr('This account is not an admin'); return; }
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  tick(); clearInterval(timer); timer = setInterval(tick, 3000);
}
async function logout() { clearInterval(timer); await sb.auth.signOut(); location.reload(); }

function tick() { loadList(); if (activeId) loadThread(); }

async function loadList() {
  const { data } = await sb.rpc('admin_conversations');
  const rows = data || [];
  const sig = JSON.stringify(rows) + activeId;
  if (sig === listSig) return;
  listSig = sig;
  $('list').innerHTML = rows.length ? rows.map(r => `
    <button onclick="openThread('${r.user_id}')" class="w-full text-left px-4 py-3 border-b hover:bg-slate-50 ${r.user_id === activeId ? 'bg-blue-50' : ''}">
      <div class="flex justify-between items-center"><span class="font-semibold text-sm">${esc(r.full_name || r.username || 'Customer')}</span><span class="text-[11px] text-slate-500">${fmt(r.last_at)}</span></div>
      <div class="flex justify-between items-center mt-0.5"><span class="text-xs text-slate-500 truncate">${r.last_sender === 'admin' ? 'You: ' : ''}${esc(r.last_body)}</span>
      ${r.unread > 0 ? `<span class="ml-2 bg-red-600 text-white text-[10px] font-bold rounded-full px-1.5 py-0.5">${r.unread}</span>` : ''}</div>
    </button>`).join('') : '<div class="p-6 text-center text-sm text-slate-500">No conversations yet.</div>';
}

function openThread(id) {
  activeId = id; msgSig = ''; listSig = '';
  $('list').classList.add('hidden');
  $('thread').classList.remove('hidden'); $('thread').classList.add('flex');
  $('reply').classList.remove('hidden'); $('reply').classList.add('flex');
  $('msgs').innerHTML = '';
  loadThread(); loadList();
}
function closeThread() {
  activeId = null; listSig = '';
  $('list').classList.remove('hidden');
  $('thread').classList.add('hidden'); $('thread').classList.remove('flex');
  loadList();
}

async function loadThread() {
  const id = activeId;
  const { data } = await sb.from('support_messages').select('*').eq('user_id', id).order('created_at', { ascending: true });
  if (id !== activeId) return;
  const list = data || [];
  const last = list[list.length - 1];
  const sig = list.length + ':' + (last ? last.id : '');
  const info = (await sb.rpc('admin_conversations')).data?.find(r => r.user_id === id);
  $('t-name').textContent = info ? (info.full_name || info.username || 'Customer') : 'Customer';
  $('t-sub').textContent = info && info.username ? 'Client ID: ' + info.username : '';
  if (sig !== msgSig) {
    msgSig = sig;
    const box = $('msgs');
    box.innerHTML = list.map(m => {
      const mine = m.sender === 'admin';
      return `<div class="flex ${mine ? 'justify-end' : 'justify-start'}"><div class="max-w-[80%] px-3 py-2 rounded-2xl text-sm ${mine ? 'bg-[#062d54] text-white' : 'bg-white border'}">${esc(m.body)}<div class="text-[10px] mt-1 opacity-60">${fmt(m.created_at)}</div></div></div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  }
  if (list.some(m => m.sender === 'user' && !m.admin_read)) {
    await sb.from('support_messages').update({ admin_read: true }).eq('user_id', id).eq('sender', 'user').eq('admin_read', false);
    loadList();
  }
}

async function send(e) {
  e.preventDefault();
  const input = $('reply-input'), body = input.value.trim();
  if (!body || !activeId) return;
  input.value = '';
  const { error } = await sb.from('support_messages').insert({ user_id: activeId, sender: 'admin', body, admin_read: true });
  if (error) { input.value = body; alert('Message failed to send'); return; }
  loadThread();
}

(async () => { const { data } = await sb.auth.getSession(); if (data.session) enter(); })();
</script>
</body>
</html>
